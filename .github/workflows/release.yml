name: Build and Release APK

on:
  push:
    branches:
      - claude/credit-card-tracker-sr7ybx
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PccardVersionCode=${{ steps.version.outputs.code }} \
            -PccardVersionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ccard-v${{ steps.version.outputs.code }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: CCard v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/ccard-v${{ steps.version.outputs.code }}.apk
